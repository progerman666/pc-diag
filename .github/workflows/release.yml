name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install smartmontools and Inno Setup
        run: choco install smartmontools innosetup -y --no-progress

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, pathlib, re, sys
          src = pathlib.Path("diag/version.py").read_text(encoding="utf-8")
          ver = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          print("version:", ver, "tag:", tag)
          if ver != tag:
              print("Версия в diag/version.py не совпадает с тегом")
              sys.exit(1)

      - name: Locate smartctl
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\smartmontools\bin\smartctl.exe',
            'C:\Program Files (x86)\smartmontools\bin\smartctl.exe'
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            "SMARTCTL_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "smartctl: $found"
          } else {
            Write-Warning 'smartctl not found, building without it'
          }

      - name: Build executables
        run: pyinstaller pc-diag.spec --noconfirm

      - name: Build portable zip
        shell: pwsh
        run: Compress-Archive -Path 'dist/pc-diag/*' -DestinationPath 'pc-diag-win64-portable.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc 'installer.iss'
          if (-not (Test-Path 'Output/pc-diag-setup.exe')) { throw 'setup.exe was not built' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-diag-win64
          path: |
            pc-diag-win64-portable.zip
            Output/pc-diag-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pc-diag-win64-portable.zip
            Output/pc-diag-setup.exe
          generate_release_notes: true
